<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Website</title>
    <style>
        /* Removes browser spacing and centers the image perfectly */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* Sets a dark background color */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Ensures the image scales down nicely on smaller screens */
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Replace 'your-image.jpg' with your actual image file name or web link -->
    <img src="images/bean sack.gif" alt="for ryan">

</body>
</html>
